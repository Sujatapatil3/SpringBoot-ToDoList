<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Todo List</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #4e73df;
            --secondary-color: #f8f9fc;
            --success-color: #1cc88a;
            --warning-color: #f6c23e;
            --danger-color: #e74a3b;
            --light-color: #f8f9fa;
            --dark-color: #5a5c69;
        }
        
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #f8f9fc;
            color: #333;
        }
        
        .navbar-custom {
            background-color: var(--primary-color);
            box-shadow: 0 0.15rem 1.75rem 0 rgba(58, 59, 69, 0.15);
        }
        
        .card {
            border: none;
            border-radius: 0.35rem;
            box-shadow: 0 0.15rem 1.75rem 0 rgba(58, 59, 69, 0.1);
            transition: all 0.3s ease;
        }
        
        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 0.5rem 1.5rem 0 rgba(58, 59, 69, 0.2);
        }
        
        .completed {
            text-decoration: line-through;
            color: #6c757d;
            background-color: rgba(28, 200, 138, 0.1);
        }
        
        .actions {
            white-space: nowrap;
        }
        
        .badge {
            font-weight: 500;
            padding: 0.35em 0.65em;
        }
        
        .btn-primary {
            background-color: var(--primary-color);
            border-color: var(--primary-color);
        }
        
        .btn-success {
            background-color: var(--success-color);
            border-color: var(--success-color);
        }
        
        .btn-warning {
            background-color: var(--warning-color);
            border-color: var(--warning-color);
        }
        
        .btn-danger {
            background-color: var(--danger-color);
            border-color: var(--danger-color);
        }
        
        .search-box {
            position: relative;
        }
        
        .search-box i {
            position: absolute;
            top: 50%;
            left: 15px;
            transform: translateY(-50%);
            color: var(--dark-color);
        }
        
        .search-input {
            padding-left: 40px;
        }
        
        .todo-item {
            transition: all 0.3s ease;
        }
        
        .todo-item:hover {
            background-color: rgba(78, 115, 223, 0.05);
        }
        
        .status-badge {
            font-size: 0.8rem;
            padding: 0.4rem 0.75rem;
            border-radius: 2rem;
        }
        
        .fade-in {
            animation: fadeIn 0.5s ease-in;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark navbar-custom mb-4">
        <div class="container">
            <a class="navbar-brand" href="#">
                <i class="fas fa-check-circle me-2"></i>Todo Manager
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link active" href="/todos">All Tasks</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/todos/pending">Pending</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/todos/completed">Completed</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="card shadow mb-4">
            <div class="card-header py-3 d-flex flex-column flex-md-row justify-content-between align-items-center">
                <h5 class="m-0 font-weight-bold text-primary">Your Todo List</h5>
                <a href="/todos/add" class="btn btn-primary mt-2 mt-md-0">
                    <i class="fas fa-plus me-1"></i> Add New Todo
                </a>
            </div>
            <div class="card-body">
                <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
                    <span th:text="${successMessage}"></span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>
                
                <div class="row mb-4">
                    <div class="col-md-6 mb-2 mb-md-0">
                        <form th:action="@{/todos/search}" method="get" class="search-box">
                            <i class="fas fa-search"></i>
                            <input type="text" name="query" class="form-control search-input" placeholder="Search todos...">
                        </form>
                    </div>
                    <div class="col-md-6 d-flex justify-content-md-end">
                        <div class="btn-group" role="group">
                            <a href="/todos" class="btn btn-outline-primary">All</a>
                            <a href="/todos/pending" class="btn btn-outline-warning">Pending</a>
                            <a href="/todos/completed" class="btn btn-outline-success">Completed</a>
                        </div>
                    </div>
                </div>
                
                <div class="table-responsive">
                    <table class="table table-hover">
                        <thead class="thead-light">
                            <tr>
                                <th>Title</th>
                                <th>Description</th>
                                <th>Due Date</th>
                                <th>Status</th>
                                <th class="actions">Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="todo : ${todos}" th:class="${todo.completed} ? 'completed fade-in' : 'fade-in'" class="todo-item">
                                <td th:text="${todo.title}"></td>
                                <td th:text="${todo.description} ?: 'No description'"></td>
                                <td>
                                    <span th:text="${#temporals.format(todo.dueDate, 'MMM dd, yyyy')}"></span>
                                    <small class="d-block text-muted" th:if="${#temporals.createToday().isAfter(todo.dueDate) and !todo.completed}" 
                                           style="color: var(--danger-color) !important;">
                                        Overdue
                                    </small>
                                </td>
                                <td>
                                    <span th:text="${todo.completed} ? 'Completed' : 'Pending'" 
                                          th:class="${todo.completed} ? 'status-badge bg-success' : 'status-badge bg-warning'"></span>
                                </td>
                                <td class="actions">
                                    <div class="btn-group btn-group-sm" role="group">
                                        <a th:href="@{/todos/toggle/{id}(id=${todo.id})}" 
                                           class="btn" 
                                           th:class="${todo.completed} ? 'btn-outline-warning' : 'btn-outline-success'"
                                           th:title="${todo.completed} ? 'Mark as Pending' : 'Mark as Complete'">
                                            <i th:class="${todo.completed} ? 'fas fa-undo' : 'fas fa-check'"></i>
                                        </a>
                                        <a th:href="@{/todos/edit/{id}(id=${todo.id})}" class="btn btn-primary" title="Edit">
                                            <i class="fas fa-edit"></i>
                                        </a>
                                        <a th:href="@{/todos/delete/{id}(id=${todo.id})}" 
                                           class="btn btn-danger"
                                           onclick="return confirm('Are you sure you want to delete this todo?')"
                                           title="Delete">
                                            <i class="fas fa-trash-alt"></i>
                                        </a>
                                    </div>
                                </td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(todos)}">
                                <td colspan="5" class="text-center text-muted py-4">
                                    <i class="fas fa-clipboard-list fa-2x mb-2"></i>
                                    <p class="mb-0">No todos found. Add your first todo!</p>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Auto-dismiss alerts after 3 seconds
        setTimeout(() => {
            const alerts = document.querySelectorAll('.alert');
            alerts.forEach(alert => {
                new bootstrap.Alert(alert).close();
            });
        }, 3000);
    </script>
</body>
</html>
